<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سایت من</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 30% 20%, #1e3a8a, #0b1020 60%);
    color: #e8eefc;
    text-align: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 48px 36px;
    max-width: 520px;
    backdrop-filter: blur(8px);
  }
  h1 { font-size: 28px; margin-bottom: 12px; }
  p { color: #9fb3d9; line-height: 1.9; }
  .badge {
    display: inline-block;
    margin-top: 22px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(56,189,248,0.15);
    color: #7dd3fc;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>سایت در حال ساخت است</h1>
    <p>اتصال گیت‌هاب و GitHub Pages با موفقیت انجام شد.<br>به‌زودی محتوای اصلی جایگزین می‌شود.</p>
    <span class="badge">sepehr007.github.io</span>
  </div>
</body>
</html>
