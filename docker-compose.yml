services:
  api:
    build:
      context: ./server
    image: hammatama-api:latest
    restart: unless-stopped
    env_file:
      - path: ./server/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /app/data
    ports:
      # Bind to loopback only; put nginx or Caddy in front for HTTPS.
      - "127.0.0.1:3001:3001"
    volumes:
      - wt-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Optional: docker compose --profile redis up -d
  # Then set REDIS_URL=redis://redis:6379 in server/.env
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - wt-redis:/data

  # Optional: docker compose --profile mongo up -d
  # Then set MONGO_URI=mongodb://mongo:27017/hammatama in server/.env
  mongo:
    image: mongo:7
    profiles: ["mongo"]
    restart: unless-stopped
    volumes:
      - wt-mongo:/data/db

volumes:
  wt-data:
  wt-redis:
  wt-mongo:
